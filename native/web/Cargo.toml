[package]
name = "bloom-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Mirror native/macos: direct Cargo builds include all engine features. The
# published Web target uses a prebuilt WASM package, so BornEngine CLI native
# profiles do not change that artifact.
default = ["jolt", "models3d", "image-extras"]
# Retained for shared profile naming; MP3 decoding is unsupported in WASM.
mp3 = []
jolt = ["bloom-shared/jolt"]
models3d = ["bloom-shared/models3d"]
image-extras = ["bloom-shared/image-extras"]
scripting = ["bloom-shared/scripting"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
bloom-shared = { path = "../shared", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Element",
    "KeyboardEvent",
    "MouseEvent",
    "TouchEvent",
    "Touch",
    "TouchList",
    "Navigator",
    "Gpu",
    "Performance",
    "GamepadEvent",
    "Gamepad",
    "GamepadButton",
    "Storage",
    "console",
] }
js-sys = "0.3"
wgpu = { version = "29", features = ["webgpu", "webgl"] }
console_error_panic_hook = "0.1"
