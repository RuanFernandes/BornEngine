[package]
name = "bloom-linux"
version = "0.1.0"
edition = "2021"

[lib]
name = "bloom_linux"
crate-type = ["staticlib"]

[features]
default = ["mp3", "jolt", "models3d", "image-extras"]
mp3 = ["bloom-shared/mp3"]
jolt = ["bloom-shared/jolt"]
# EN-014 — see native/shared/Cargo.toml. Default-on for direct Cargo builds;
# BornEngine CLI profiles disable unused features for native game builds.
models3d = ["bloom-shared/models3d"]
image-extras = ["bloom-shared/image-extras", "image/hdr", "image/jpeg", "image/bmp", "image/tga"]
sqlite = ["bloom-shared/sqlite"]
scripting = ["bloom-shared/scripting"]
hot-reload = ["bloom-shared/hot-reload"]
dev = ["hot-reload"]
debug-ui = ["bloom-shared/debug-ui"]

[dependencies]
bloom-shared = { path = "../shared", default-features = false }
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
wgpu = "29"
libc = "0.2"
arboard = "3"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2"
alsa = "0.9"
