<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BornEngine — Native games from TypeScript.</title>
  <desc id="desc">BornEngine is a function-first TypeScript game engine for native platforms and Web/WASM.</desc>
