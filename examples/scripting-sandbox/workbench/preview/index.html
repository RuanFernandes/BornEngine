<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BornEngine Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0f131c; }
      #bloom-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #c4ccd4; font: 14px system-ui, sans-serif; pointer-events: none; }
    </style>
    <script>
      window.__bloomReady = new Promise((resolve, reject) => {
        window.__bloomReadyResolve = resolve;
        window.__bloomReadyReject = reject;
      });
    </script>
    <script type="importmap">
      { "imports": { "env": "/env.js" } }
    </script>
  </head>
  <body>
    <canvas id="bloom-canvas" tabindex="0" aria-label="BornEngine game preview"></canvas>
    <div id="loading" role="status">Starting BornEngine…</div>
    <script type="module" src="/src/preview/browser-bootstrap.ts"></script>
  </body>
</html>
