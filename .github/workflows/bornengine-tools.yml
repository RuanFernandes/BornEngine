name: BornEngineTools

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitignore'
      - '.github/workflows/bornengine-tools.yml'
      - 'tools/vscode/bornengine-tools/**'
  push:
    branches: [main]
    tags: ['bornengine-tools-v*']
  workflow_dispatch:

concurrency:
  group: bornengine-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Test and package extension
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tools/vscode/bornengine-tools
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode/bornengine-tools/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run extension tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npm run package -- --out "$RUNNER_TEMP/bornengine-tools.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: bornengine-tools-vsix
          path: ${{ runner.temp }}/bornengine-tools.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Visual Studio Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bornengine-tools-v')
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tools/vscode/bornengine-tools
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode/bornengine-tools/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#bornengine-tools-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Download validated VSIX
        uses: actions/download-artifact@v4
        with:
          name: bornengine-tools-vsix
          path: ${{ runner.temp }}

      - name: Publish VSIX using GitHub OIDC
        run: npx vsce publish --oidc --packagePath "$RUNNER_TEMP/bornengine-tools.vsix" --skip-duplicate
