name: Tests

# Runs on every PR to main, every push to main, and on version tag pushes
# (so release.yml can gate publish on a green Tests run for the exact SHA
# being released). Mirrors the gating pattern from the Perry compiler repo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pin macOS deployment target so cached object files carry a stable
  # LC_VERSION_MIN regardless of which runner image Apple rolls to next.
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  # ---------------------------------------------------------------------------
  # Shared crate unit tests on all three host OSes. Runs the jolt_sys smoke
  # tests (bj_global_init → bj_world_create → bj_world_step → gravity fall →
  # teardown), which exercise the compiled Jolt static lib at runtime. This
  # is the strongest signal that the Rapier → Jolt migration works on each
  # platform — a cmake build-only check would miss runtime issues like
  # mismatched C++ ABI or thread-pool problems.
  #
  # Linux needs cmake + a C++ toolchain for the shim. Windows gets MSVC via
  # the ilammy action so cmake's CXX compiler probe succeeds.
  # ---------------------------------------------------------------------------
  shared-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps (cmake + C++)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config

      - name: Set up MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fingerprint Jolt cache inputs
        id: jolt-cache
        shell: bash
        run: |
          jolt_revision="$(git ls-tree HEAD native/third_party/JoltPhysics | awk '{print $3}')"
          cmake_version="$(cmake --version | head -n 1)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            compiler_version="${VCToolsVersion:-}"
            if [[ -z "$compiler_version" ]]; then
              compiler_version="$(cl 2>&1 | head -n 1 || true)"
            fi
            compiler_version="${compiler_version:-unknown}-${WindowsSDKVersion:-unknown}"
          else
            compiler_version="$(c++ --version | head -n 1)"
          fi
          target_config="none"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            target_config="macos-${MACOSX_DEPLOYMENT_TARGET:-default}-sdk-$(xcrun --sdk macosx --show-sdk-version)"
          fi
          toolchain="$(printf '%s-%s' "$cmake_version" "$compiler_version" | tr -cs '[:alnum:].-' '-')"
          echo "fingerprint=$jolt_revision-$toolchain-$target_config" >> "$GITHUB_OUTPUT"

      - name: Cache stable Jolt CMake build
        uses: actions/cache@v4
        with:
          path: native/third_party/bloom_jolt/build
          # Exact-match only: build.rs reuses existing archives without
          # reconfiguring them, so a stale CMake output must never be restored.
          key: ${{ runner.os }}-${{ runner.arch }}-jolt-${{ steps.jolt-cache.outputs.fingerprint }}-${{ hashFiles('.github/workflows/test.yml', 'native/shared/Cargo.lock', 'native/macos/Cargo.lock', 'native/linux/Cargo.lock', 'native/windows/Cargo.lock', 'native/shared/build.rs', 'native/third_party/bloom_jolt/CMakeLists.txt', 'native/third_party/bloom_jolt/include/**', 'native/third_party/bloom_jolt/src/**') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/shared/target
          key: ${{ runner.os }}-shared-${{ hashFiles('native/shared/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-shared-

      - name: cargo test (bloom-shared + jolt)
        working-directory: native/shared
        if: matrix.os != 'windows-latest'
        run: cargo test --release

      - name: cargo test (bloom-shared + jolt, serialized Windows)
        working-directory: native/shared
        if: matrix.os == 'windows-latest'
        run: cargo test --release -- --test-threads=1

      - name: Test optional SQLite and scripting features
        working-directory: native/shared
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --no-default-features --features sqlite,scripting --test native_optional_features

  # ---------------------------------------------------------------------------
  # FFI parity: every function in package.json's perry.nativeLibrary manifest
  # must be exported with matching arity by every platform crate (hand-written
  # or via define_core_ffi!/define_physics_ffi!). This is the check whose
  # absence let Android ship 60 functions behind (#59) and Windows ship the
  # whole scene-graph surface as silent no-op stubs. Cheap (pure text parse),
  # runs everywhere, gates merges.
  # ---------------------------------------------------------------------------
  ffi-parity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: validate-ffi
        run: node tools/validate-ffi.js
      - name: test FFI parser
        run: node --test tools/ffi-parser.test.cjs
      - name: validate Colyseus runtime matrix
        run: node --test tests/colyseus/platform-matrix.test.mjs
      - name: file line limit (2000, ratcheting baseline)
        run: node tools/check-file-lines.js
      - name: Check the shared crate without 3D model support
        run: cargo check --manifest-path native/shared/Cargo.toml --no-default-features --features web

  # watchOS has no prebuilt Rust std target, so CI compiles std for the Apple
  # target before checking the hand-written Canvas FFI adapter.
  check-watchos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust and watchOS target
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-apple-watchos
      - name: Check watchOS engine without optional SQLite
        run: cargo +nightly check -Z build-std=std,panic_abort --manifest-path native/watchos/Cargo.toml --target aarch64-apple-watchos --no-default-features --features mp3,jolt,models3d,image-extras,dev,scripting
      - name: Check watchOS engine with optional SQLite
        run: cargo +nightly check -Z build-std=std,panic_abort --manifest-path native/watchos/Cargo.toml --target aarch64-apple-watchos --no-default-features --features mp3,jolt,models3d,image-extras,dev,sqlite,scripting

  # ---------------------------------------------------------------------------
  # Lint: Clippy is blocking. rustfmt remains advisory because the shared
  # crate's existing formatting baseline produces about 42,824 lines of diff;
  # formatting it wholesale would also exceed the ratcheting file-line limit.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt --check (shared)
        working-directory: native/shared
        continue-on-error: true
        run: cargo fmt --check

      - name: clippy (shared)
        working-directory: native/shared
        run: cargo clippy --release --no-deps -- -D warnings

  # ---------------------------------------------------------------------------
  # TypeScript correctness. Steps: typecheck, lint, format:check,
  # typecheck:tests, test:unit, test:tools, the harness runner (entries marked
  # ci:true need native libs and run in build-linux), and examples:check:static.
  # ---------------------------------------------------------------------------
  ts-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Perry
        uses: ./.github/actions/setup-perry

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Harness runner tests
        run: npm run test:tools

      - name: TypeScript harnesses
        run: node tools/run-ts-harnesses.mjs

      - name: Check examples (static)
        run: npm run examples:check:static

  # ---------------------------------------------------------------------------
  # Per-platform builds: each native crate is a separate Cargo workspace root
  # (one Cargo.lock per platform) and they only build on their own OS.
  # A successful build proves that:
  #   1. The platform crate compiles against the current shared API
  #   2. The Jolt C++ shim builds for that target (cmake picks a working
  #      toolchain)
  #   3. wgpu + the platform's windowing + audio deps resolve cleanly
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fingerprint Jolt cache inputs
        id: jolt-cache
        shell: bash
        run: |
          jolt_revision="$(git ls-tree HEAD native/third_party/JoltPhysics | awk '{print $3}')"
          cmake_version="$(cmake --version | head -n 1)"
          compiler_version="$(c++ --version | head -n 1)"
          target_config="macos-${MACOSX_DEPLOYMENT_TARGET:-default}-sdk-$(xcrun --sdk macosx --show-sdk-version)"
          toolchain="$(printf '%s-%s' "$cmake_version" "$compiler_version" | tr -cs '[:alnum:].-' '-')"
          echo "fingerprint=$jolt_revision-$toolchain-$target_config" >> "$GITHUB_OUTPUT"

      - name: Cache stable Jolt CMake build
        uses: actions/cache@v4
        with:
          path: native/third_party/bloom_jolt/build
          key: ${{ runner.os }}-${{ runner.arch }}-jolt-${{ steps.jolt-cache.outputs.fingerprint }}-${{ hashFiles('.github/workflows/test.yml', 'native/shared/Cargo.lock', 'native/macos/Cargo.lock', 'native/linux/Cargo.lock', 'native/windows/Cargo.lock', 'native/shared/build.rs', 'native/third_party/bloom_jolt/CMakeLists.txt', 'native/third_party/bloom_jolt/include/**', 'native/third_party/bloom_jolt/src/**') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/macos/target
          key: ${{ runner.os }}-macos-crate-${{ hashFiles('native/macos/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-macos-crate-

      - name: cargo build --release (bloom-macos)
        working-directory: native/macos
        run: cargo build --release

  build-linux:
    # Perry's Linux compiler binary requires glibc 2.39. Release artifacts
    # remain built on Ubuntu 22.04 in release.yml for broader compatibility.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (X11, ALSA, cmake, C++ toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libasound2-dev libpulse-dev zstd \
            pkg-config cmake build-essential xvfb xauth mesa-vulkan-drivers

      - name: Fingerprint Jolt cache inputs
        id: jolt-cache
        shell: bash
        run: |
          jolt_revision="$(git ls-tree HEAD native/third_party/JoltPhysics | awk '{print $3}')"
          cmake_version="$(cmake --version | head -n 1)"
          compiler_version="$(c++ --version | head -n 1)"
          target_config="none"
          toolchain="$(printf '%s-%s' "$cmake_version" "$compiler_version" | tr -cs '[:alnum:].-' '-')"
          echo "fingerprint=$jolt_revision-$toolchain-$target_config" >> "$GITHUB_OUTPUT"

      - name: Cache stable Jolt CMake build
        uses: actions/cache@v4
        with:
          path: native/third_party/bloom_jolt/build
          key: ${{ runner.os }}-${{ runner.arch }}-jolt-${{ steps.jolt-cache.outputs.fingerprint }}-${{ hashFiles('.github/workflows/test.yml', 'native/shared/Cargo.lock', 'native/macos/Cargo.lock', 'native/linux/Cargo.lock', 'native/windows/Cargo.lock', 'native/shared/build.rs', 'native/third_party/bloom_jolt/CMakeLists.txt', 'native/third_party/bloom_jolt/include/**', 'native/third_party/bloom_jolt/src/**') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/linux/target
          key: ${{ runner.os }}-linux-crate-${{ hashFiles('native/linux/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-linux-crate-

      - name: Check a feature-minimal 2D native build
        working-directory: native/linux
        run: cargo check --no-default-features --features mp3

      - name: Check optional SQLite native feature
        working-directory: native/linux
        run: cargo check --no-default-features --features mp3,sqlite

      - name: Check optional QuickJS native feature
        working-directory: native/linux
        run: cargo check --no-default-features --features mp3,scripting

      - name: Check the 2.5D native build profile
        working-directory: native/linux
        run: cargo check --no-default-features --features mp3,models3d,image-extras

      - name: cargo build --release (bloom-linux)
        working-directory: native/linux
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test embedded scripting component contract
        run: npm run test:scripting

      - name: Install dependencies
        run: npm install

      - name: Setup Perry
        uses: ./.github/actions/setup-perry

      - name: Test Game, asset scopes, and scene disposal contracts
        run: npm run test:runtime

      - name: Generate audio harness fixture
        run: python3 tests/game-runtime/make-tone.py

      - name: Run TypeScript harnesses including native-library ones
        run: |
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "Mesa lavapipe Vulkan ICD was not installed."
            exit 1
          fi
          xvfb-run -a env \
            BLOOM_HEADLESS=1 \
            WGPU_BACKEND=vulkan \
            VK_ICD_FILENAMES="$lvp_icd" \
            node tools/run-ts-harnesses.mjs --include-ci

      - name: Install native TypeScript smoke dependencies
        run: |
          npm install --prefix examples/colyseus-smoke --no-package-lock
          npm ci --prefix tests/colyseus/server

      - name: Run Game, scene, asset, and disposal integration smoke
        working-directory: examples/colyseus-smoke
        run: |
          profile_dir="$RUNNER_TEMP/bornengine-cargo-profile"
          real_cargo="$(command -v cargo)"
          mkdir -p "$profile_dir"
          cat > "$profile_dir/cargo" <<'EOF'
          #!/bin/sh
          engine_root="$BORNENGINE_PROFILE_ENGINE_ROOT"
          is_engine_build=0
          has_feature_override=0
          for arg in "$@"; do
            case "$arg" in
              "$engine_root"/native/*/Cargo.toml) is_engine_build=1 ;;
              --manifest-path="$engine_root"/native/*/Cargo.toml) is_engine_build=1 ;;
              --no-default-features|--all-features|--features|-F|--features=*) has_feature_override=1 ;;
            esac
          done
          if [ "$is_engine_build" -eq 1 ] && [ "$has_feature_override" -eq 0 ]; then
            exec "$BORNENGINE_PROFILE_REAL_CARGO" "$@" --no-default-features --features mp3
          fi
          exec "$BORNENGINE_PROFILE_REAL_CARGO" "$@"
          EOF
          chmod +x "$profile_dir/cargo"
          trap 'rm -rf "$profile_dir"' EXIT
          PATH="$profile_dir:$PATH" \
            BORNENGINE_PROFILE_ENGINE_ROOT="$GITHUB_WORKSPACE" \
            BORNENGINE_PROFILE_REAL_CARGO="$real_cargo" \
            PERRY_ALLOW_PERRY_FEATURES=1 \
            perry compile lifecycle-integration.ts --target linux --no-cache -o /tmp/bornengine-lifecycle-integration
          /tmp/bornengine-lifecycle-integration

      - name: Check all BornEngine examples
        run: npm run examples:check

      - name: Compile class-first TypeScript API to native
        working-directory: examples/colyseus-smoke
        run: npm run build

      - name: Run native Matrix4 smoke test
        working-directory: examples/colyseus-smoke
        run: npm run test:math

      - name: Run native Perry Colyseus movement smoke
        working-directory: examples/colyseus-smoke
        run: |
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "Mesa lavapipe Vulkan ICD was not installed."
            exit 1
          fi
          xvfb-run -a env \
            BLOOM_HEADLESS=1 \
            WGPU_BACKEND=vulkan \
            VK_ICD_FILENAMES="$lvp_icd" \
            npm run test:colyseus

      - name: Run native Game lifecycle smoke test
        working-directory: examples/colyseus-smoke
        run: |
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$lvp_icd" ]; then
            echo "Mesa lavapipe Vulkan ICD was not installed."
            exit 1
          fi
          xvfb-run -a env \
            BLOOM_HEADLESS=1 \
            WGPU_BACKEND=vulkan \
            VK_ICD_FILENAMES="$lvp_icd" \
            npm run test:lifecycle

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        # Populates LIB / INCLUDE / PATH so cmake (which builds the Jolt C++
        # shim via bloom-shared's build.rs) can find the Windows SDK. Without
        # this, jolt cmake fails the initial CXX compiler probe even though
        # MSVC is installed on the runner.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fingerprint Jolt cache inputs
        id: jolt-cache
        shell: bash
        run: |
          jolt_revision="$(git ls-tree HEAD native/third_party/JoltPhysics | awk '{print $3}')"
          cmake_version="$(cmake --version | head -n 1)"
          compiler_version="${VCToolsVersion:-}"
          if [[ -z "$compiler_version" ]]; then
            compiler_version="$(cl 2>&1 | head -n 1 || true)"
          fi
          compiler_version="${compiler_version:-unknown}-${WindowsSDKVersion:-unknown}"
          target_config="none"
          toolchain="$(printf '%s-%s' "$cmake_version" "$compiler_version" | tr -cs '[:alnum:].-' '-')"
          echo "fingerprint=$jolt_revision-$toolchain-$target_config" >> "$GITHUB_OUTPUT"

      - name: Cache stable Jolt CMake build
        uses: actions/cache@v4
        with:
          path: native/third_party/bloom_jolt/build
          key: ${{ runner.os }}-${{ runner.arch }}-jolt-${{ steps.jolt-cache.outputs.fingerprint }}-${{ hashFiles('.github/workflows/test.yml', 'native/shared/Cargo.lock', 'native/macos/Cargo.lock', 'native/linux/Cargo.lock', 'native/windows/Cargo.lock', 'native/shared/build.rs', 'native/third_party/bloom_jolt/CMakeLists.txt', 'native/third_party/bloom_jolt/include/**', 'native/third_party/bloom_jolt/src/**') }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/windows/target
          key: ${{ runner.os }}-windows-crate-${{ hashFiles('native/windows/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-windows-crate-

      - name: cargo build --release (bloom-windows)
        working-directory: native/windows
        run: cargo build --release

  # ---------------------------------------------------------------------------
  # Web / WASM. No submodule needed: bloom-shared's build.rs early-exits on
  # target_arch=wasm32, and web physics is bridged to JoltPhysics.js at
  # runtime rather than a native Jolt static lib.
  # ---------------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check web build output safety
        run: bash native/web/tests/build-output-safety.sh

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack 0.15.0
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- --version 0.15.0

      - name: Install Web and Colyseus fixture dependencies
        run: |
          npm ci --prefix native/web
          npm ci --prefix tests/colyseus/server

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/web/target
            native/shared/target
          key: ${{ runner.os }}-web-${{ hashFiles('native/web/Cargo.lock', 'native/shared/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-web-

      - name: cargo check (shared, wasm32, web feature)
        working-directory: native/shared
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features web

      - name: Build assembled Web package
        run: bash native/web/build.sh --dev --output "$RUNNER_TEMP/bornengine-web"

      - name: Test Web Colyseus bridge adapter
        run: node --test native/web/tests/colyseus_bridge.test.mjs

      - name: Run Web Colyseus runtime smoke
        env:
          COLYSEUS_BRIDGE_MODULE: ${{ runner.temp }}/bornengine-web/colyseus_bridge.bundle.js
        run: node tests/colyseus/run-server-smoke.mjs tests/colyseus/web-bridge-smoke.mjs

      - name: Verify bundled Web Colyseus SDK
        run: test -s "$RUNNER_TEMP/bornengine-web/colyseus_bridge.bundle.js"

  scripting-sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install scripting sandbox dependencies
        working-directory: examples/scripting-sandbox
        run: pnpm install --frozen-lockfile

      - name: Check, test, and build scripting sandbox
        working-directory: examples/scripting-sandbox
        run: pnpm check && pnpm test && pnpm build:workbench
