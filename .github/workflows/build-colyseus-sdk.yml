name: Build Colyseus Native SDK Artifacts

on:
  push:
    paths:
      - '.github/workflows/build-colyseus-sdk.yml'
      - 'native/third_party/colyseus-sdk-src'
      - 'native/third_party/colyseus/VERSION.md'
      - 'native/third_party/colyseus/lib/**'
      - 'native/shared/Cargo.toml'
      - 'native/shared/Cargo.lock'
      - 'native/shared/build.rs'
      - 'native/shared/src/colyseus.rs'
      - 'native/shared/src/colyseus_targets.rs'
      - 'native/linux/Cargo.toml'
      - 'native/linux/Cargo.lock'
      - 'native/macos/Cargo.toml'
      - 'native/macos/Cargo.lock'
      - 'native/windows/Cargo.toml'
      - 'native/windows/Cargo.lock'
      - 'native/ios/Cargo.toml'
      - 'native/ios/Cargo.lock'
      - 'tools/build-colyseus-sdk.sh'
      - 'tools/patches/colyseus-native-sdk-windows-msvc.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            cargo_manifest: native/linux/Cargo.toml
            runner: ubuntu-22.04
          - rust_target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            cargo_manifest: native/linux/Cargo.toml
            runner: ubuntu-22.04-arm
          - rust_target: x86_64-apple-darwin
            artifact: macos-x86_64
            cargo_manifest: native/macos/Cargo.toml
            runner: macos-14
          - rust_target: aarch64-apple-darwin
            artifact: macos-aarch64
            cargo_manifest: native/macos/Cargo.toml
            runner: macos-14
          - rust_target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            cargo_manifest: native/windows/Cargo.toml
            runner: windows-latest
          - rust_target: aarch64-apple-ios
            artifact: ios-aarch64
            cargo_manifest: native/ios/Cargo.toml
            runner: macos-14
          - rust_target: aarch64-apple-ios-sim
            artifact: ios-aarch64-sim
            cargo_manifest: native/ios/Cargo.toml
            runner: macos-14
          - rust_target: x86_64-apple-ios
            artifact: ios-x86_64-sim
            cargo_manifest: native/ios/Cargo.toml
            runner: macos-14

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: step-security/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: ${{ matrix.artifact }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libasound2-dev libpulse-dev pkg-config cmake build-essential

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/linux/target
            native/macos/target
            native/windows/target
            native/ios/target
          key: ${{ runner.os }}-${{ runner.arch }}-colyseus-${{ matrix.rust_target }}-${{ hashFiles('native/shared/Cargo.lock', 'native/linux/Cargo.lock', 'native/macos/Cargo.lock', 'native/windows/Cargo.lock', 'native/ios/Cargo.lock') }}

      - name: Build static SDK closure
        shell: bash
        env:
          ZIG: zig
          COLYSEUS_ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/colyseus-zig-global-${{ matrix.artifact }}
        run: bash tools/build-colyseus-sdk.sh "${{ matrix.rust_target }}"

      - name: Link engine static library against Colyseus SDK
        run: cargo build --release --manifest-path "${{ matrix.cargo_manifest }}" --no-default-features --target "${{ matrix.rust_target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: colyseus-sdk-${{ matrix.artifact }}
          path: native/third_party/colyseus/lib/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
